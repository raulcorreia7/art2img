name: CI

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'cpp' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
            arch: x64
          - os: windows-latest
            arch: Win32
    
    runs-on: ${{ matrix.os }}
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y lcov
        
    - name: Cache CPM dependencies
      uses: actions/cache@v4
      with:
        path: .cache
        key: ${{ runner.os }}-${{ matrix.arch || 'default' }}-cpm-${{ hashFiles('cmake/CPM.cmake', '**/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.arch || 'default' }}-cpm-
          
    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON ${{ matrix.arch && format('-A {0}', matrix.arch) || '' }}
        
    - name: Configure CMake (Unix)
      if: runner.os != 'Windows'
      run: |
        if [ "${{ runner.os }}" = "macOS" ]; then
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
        else
          which ninja && cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -G Ninja || cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
        fi
        
    - name: Build (Windows)
      if: runner.os == 'Windows'
      run: |
        cmake --build build --config Debug --parallel 4
        
    - name: Build (Unix)
      if: runner.os != 'Windows'
      run: |
        if [ "${{ runner.os }}" = "macOS" ]; then
          cmake --build build --config Debug --parallel 4
        else
          which ninja && cmake --build build --config Debug --parallel 4 || cmake --build build --config Debug --parallel 4
        fi
        
    - name: Build Verification
      if: always()
      shell: bash
      run: |
        cd build
        if [ "${{ runner.os }}" = "Windows" ]; then
          # Windows: Look for test executables with .exe extension
          TEST_PATHS=$(find . -name "*_tests.exe" -type f 2>/dev/null || true)
          if [ -z "$TEST_PATHS" ]; then
            echo "No test executables found with *_tests.exe pattern"
            # Fallback: look for any .exe files that might be tests
            ALL_EXES=$(find . -name "*.exe" -type f 2>/dev/null || true)
            if [ -n "$ALL_EXES" ]; then
              echo "Found other executables:"
              echo "$ALL_EXES"
              # Check if any contain test-related keywords
              for exe in $ALL_EXES; do
                if echo "$exe" | grep -qi "test"; then
                  TEST_PATHS="$TEST_PATHS $exe"
                fi
              done
            fi
          fi
          if [ -z "$TEST_PATHS" ]; then
            echo "No test executables found in build directory"
            find . -name "*.exe" -type f 2>/dev/null || echo "No executables found"
            exit 1
          fi
          echo "Found test executables:"
          echo "$TEST_PATHS"
        else
          # Unix/macOS: Use portable find syntax (no -executable flag for BSD compatibility)
          TEST_PATHS=$(find . -name "*_tests" -type f 2>/dev/null | xargs test -x 2>/dev/null || true)
          if [ -z "$TEST_PATHS" ]; then
            echo "No test executables found with *_tests pattern"
            # Fallback: look for any files that might be executables
            ALL_FILES=$(find . -name "art2img*" -type f 2>/dev/null || true)
            if [ -n "$ALL_FILES" ]; then
              echo "Found art2img-related files:"
              echo "$ALL_FILES"
              # Check which ones are executable
              for file in $ALL_FILES; do
                if [ -x "$file" ]; then
                  TEST_PATHS="$TEST_PATHS $file"
                fi
              done
            fi
          fi
          if [ -z "$TEST_PATHS" ]; then
            echo "No test executables found in build directory"
            find . -name "art2img*" -type f 2>/dev/null || echo "No executables found"
            exit 1
          fi
          echo "Found test executables:"
          echo "$TEST_PATHS"
        fi
        
    - name: Test
      if: always()
      env:
        ART2IMG_CLI_PATH: ${{ github.workspace }}/build/cli/art2img
      shell: bash
      run: |
        cd build
        # Use appropriate parallelization based on platform
        if [ "${{ runner.os }}" = "Windows" ]; then
          # Windows: Use reasonable parallelism but not too aggressive
          ctest --output-on-failure --parallel 2 --timeout 300
        elif [ "${{ runner.os }}" = "macOS" ]; then
          # macOS: Use moderate parallelism
          ctest --output-on-failure --parallel 2 --timeout 300
        else
          # Linux: Can use more aggressive parallelism
          ctest --output-on-failure --parallel 4 --timeout 300
        fi
        
    - name: Test Status Check
      if: always()
      shell: bash
      run: |
        if [ "${{ job.status }}" = "failure" ]; then
          echo "Job failed on ${{ matrix.os }}"
          echo "Check the test logs above for specific failure details"
          exit 1
        elif [ "${{ job.status }}" = "success" ]; then
          echo "All tests passed on ${{ matrix.os }}"
        else
          echo "Job status: ${{ job.status }} on ${{ matrix.os }}"
          exit 1
        fi
        
    - name: Generate coverage (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        cd build
        if [ -f coverage.info ]; then
          lcov --remove coverage.info '/usr/*' --output-file coverage.info
          lcov --list coverage.info
        fi
        
    - name: Upload coverage (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      uses: codecov/codecov-action@v3
      with:
        file: ./build/coverage.info
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Upload build artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts-${{ matrix.os }}-${{ matrix.arch || 'default' }}
        path: |
          build/
          !build/.cmake/
        retention-days: 7
