name: CI

on:
  push:
    branches: [ master, development ]
  pull_request:
    branches: [ master, development ]

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'cpp' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"

  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        cxx: [g++-13]
        build_type: [Release, Debug]
        include:
          - cxx: g++-13
            std: c++23

    steps:
    - uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake ninja-build git

    - name: Install g++-12
      if: matrix.cxx == 'g++-12'
      run: |
        sudo apt-get update
        sudo apt-get install -y g++-12

    - name: Install g++-13
      if: matrix.cxx == 'g++-13'
      run: |
        sudo apt-get update
        sudo apt-get install -y g++-13

    - name: Configure CMake
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
          -DCMAKE_CXX_STANDARD=23 \
          -DART2IMG_TESTS=ON
        # Show compiler version for debugging
        ${{ matrix.cxx }} --version

    - name: Build
      run: |
        cmake --build build --config ${{ matrix.build_type }}

    - name: Run tests
      run: |
        cd build && ctest --output-on-failure

    - name: Upload build artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts-${{ matrix.cxx }}-${{ matrix.build_type }}
        path: |
          build/
          !build/.cmake/
        retention-days: 7

  build-macos:
    runs-on: macos-latest
    
    strategy:
      matrix:
        build_type: [Release, Debug]

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        brew install cmake ninja

    - name: Configure CMake
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_CXX_STANDARD=23 \
          -DART2IMG_TESTS=ON

    - name: Build
      run: |
        cmake --build build --config ${{ matrix.build_type }}

    - name: Run tests
      run: |
        cd build && ctest --output-on-failure

    - name: Upload build artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts-macos-${{ matrix.build_type }}
        path: |
          build/
          !build/.cmake/
        retention-days: 7

  build-windows:
    runs-on: windows-latest

    strategy:
      matrix:
        build_type: [Release, Debug]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        # Install CMake and Ninja via chocolatey
        choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
        choco install ninja -y

    - name: Configure CMake
      shell: bash
      run: |
        # Add CMake and Ninja to PATH for bash shell
        export PATH="/c/Program Files/CMake/bin:$PATH"
        export PATH="/c/ProgramData/chocolatey/bin:$PATH"
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_CXX_STANDARD=23 \
          -DART2IMG_TESTS=ON

    - name: Build
      shell: bash
      run: |
        # Add CMake and Ninja to PATH for bash shell
        export PATH="/c/Program Files/CMake/bin:$PATH"
        export PATH="/c/ProgramData/chocolatey/bin:$PATH"
        cmake --build build --config ${{ matrix.build_type }}

    - name: Run tests
      shell: bash
      run: |
        # Add CMake and Ninja to PATH for bash shell
        export PATH="/c/Program Files/CMake/bin:$PATH"
        export PATH="/c/ProgramData/chocolatey/bin:$PATH"
        cd build && ctest --output-on-failure

    - name: Upload build artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts-windows-${{ matrix.build_type }}
        path: |
          build/
          !build/.cmake/
        retention-days: 7
